# =============================================================================
# raicom 赛道专属 Nav2 参数
# =============================================================================
# 选定方式：nav2.launch.py 的 _per_track_params 按 world 名优先取
#   params/navfn_dwb_<world>_nav2_params.yaml，取不到才回退通用档
#   navfn_dwb_nav2_params.yaml。竞赛入口保持 use_planner:=navfn_dwb 不变即自动命中。
#   ⚠️ 该函数查的是 **install/ 侧**：新建本文件后必须跑一次
#      colcon build --symlink-install --packages-select tianracer_navigation2
#      生成软链，否则永远回退通用档，表现为「改了配置却不生效」。
#
# 本文件 = 【工作区】通用档的完整副本，相对 **HEAD 的通用档**多改的只有速度一组：
#   max_vel_x / max_speed_xy 1.5->2.0、min_vel_x 0.6->0.4、smoother 的
#   max|min_velocity（wz 上限 2.5->3.33，保持最小转弯半径 0.60m）。
#   inflation_radius / costmap 等一律不动，以便归因。
#
# ── ⚠️ AMCL 段的来源（动 AMCL 前必读）────────────────────────────────────
# 本文件的 amcl: 段沿用 **DWB 家族既有值**（ROS1 对齐版：DifferentialMotionModel、
#   alpha1~4 = 0.1、laser_max_range 3.5、max_beams 180、粒子 3000/500、z_hit 0.5、
#   z_rand 0.5），与已提交的 navfn_dwb_r1 / navfn_dwb_test_indoor / navfn_mppi* 一致；
#   但**与 HEAD 的通用档不同**（后者仍是 OmniMotionModel legacy 版）——因为通用档那组
#   AMCL 改动**至今未提交**（用户 2026-09-17 明确选择「AMCL 原样留着」，b997947
#   刻意只含 BT/注入/赛道专属参数）。
#   该组值在记忆 amcl-ros1-alignment-refuted 里**被 2v2 实测否证**（test_indoor
#   4/9 -> 1/9），且「地图错位修好后是否反超 legacy」**至今未回答**。
#   ⇒ 本档的 4/5 / 66.28 **就是在这套 AMCL 下测得的**，不是 legacy 基线的成绩。
#     将来做任何 AMCL 相关结论前，先确认树里到底是哪一套。
#
# ── 2026-09-18 实测结论（每档 5 轮，评分 = 50 + 35·min(1, 42/T)）──────────
#   档位                        完赛   T（完赛轮）     最佳分   失效形态
#   @1.5 / min_vel_x 0.6（基线） 4/5   96.3~106.9s    65.26    1 次原地判停
#   @2.0 / min_vel_x 0.6         2/5   88.3~89.9s     66.64    1 原地判停 + 2 过门超时
#   @2.0 / min_vel_x 0.4 ★本档   4/5   90.3~107.7s    66.28    0 原地判停，1 过门超时
#   @2.0 / sim_time 0.6          0/5   —              —        全部过门超时
#   @2.5（wz 同步 4.17）          0/5   —              —        全在第一圈内卡死
#   ⇒ 本档即定稿：比基线 **+1.02 分**，且「原地判停」硬卡死类**归零**。
#
# ⚠️ 三个方向都已试尽，**不要再调**：
#   · max_vel_x 2.5 -> 0/5：它不是"多了一个更快的选项"，而是**超出赛道能力**——
#     贴顶比例**反由 58.5% 降到 9.5~33.7%**，车连 2.0 都跑不出来（视界随 vx 拉到
#     2.0m，快候选弧线大面积扫出 0.7~0.9m 的自由带 ⇒ 快候选几乎全非法）。
#     注意 racetrack_1 在**同样的 2.0m 视界**下稳定 9/9 ⇒ **上限是赛道几何的函数，
#     不能外推**。
#   · sim_time 0.6 -> 0/5：视界长度**不只是可行性旋钮，它是速度选择的驱动量**——
#     轨迹越短，PathDist/GoalDist 这类"推进型" critic 累积越少，判据退化为
#     「障碍代价最小 = 最慢」，`vx_nav` 中位从 2.000 塌到 0.400（地板）。反方向
#     （sim_time 1.2 / 视界 1.8m）当年也是 0/9，**两头都不能动**。
#   · min_vel_x 0.6->0.4 是本档的**关键改动**：卡死时 420 条候选全非法，0.6 的地板
#     让车一步不能动（撞 judge 的 10s 未移动判停），0.4 让它还能爬出来。已优化到位。
# 残余问题：两处 chicane（(7,6) 与 (5~6,5~6) 一带有 0.1m 厚碎墙块）偶发卡顿，
#   代价 ~15s 或 1/5 的过门超时。未试过的最后候选是 global_costmap 的
#   inflation_radius 0.3->0.45，但机理未必同源（见 racetrack1-apex-cut-wall-deadlock：
#   那里是"路径离墙 0.326m 而影响圈止步 0.3"，而 raicom 卡点处路径离墙 0.447m）。
#
# 运行：WORLD=raicom bash tianracer_navigation2/tools/dwb_round_retry.sh <标签> 5
# =============================================================================

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    base_frame_id: <robot_namespace>/base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 1.0
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: <robot_namespace>/map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 3000
    min_particles: 500
    odom_frame_id: <robot_namespace>/odom
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # 运动模型：差分（Ackermann 车不能横移；对齐 ROS1 odom_model_type=diff）
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    # 启动即自动定位：AMCL 在 configure 阶段直接采用该位姿，无需再发 /initialpose 话题。
    # 注意：出生位姿由 nav2.launch.py 按 world:= 从 track_spawn.py 注入，此处数值仅作未注入时的回退。
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.54

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: <robot_namespace>/map
    robot_base_frame: <robot_namespace>/base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # ⚠️ 10.0 是实测后的定稿值，**不要下调**。2026-09-17 曾试过降到 4.0，理由是该值
      # 恰好等于裁判的 stop_time_threshold = 10.0s（judge.launch.py），两个计时器同时
      # 起步、裁判必然先到。但实跑证明这是**显著回归**：4.0 组完赛 2/8，10.0 组 6/7
      # （Fisher p≈0.04）。因为窗口缩小 2.5 倍使「无进展」判定触发频率大增，每次恢复
      # 都会清代价地图并后退 0.35m，车因此更容易被推进 test_indoor 的 (-1.77, 3.78)
      # 死角——那里前进/倒车**双向锁死**，进入必然丢轮。
      # 而且下调本就治不了那个死角：BackUp 自己在那儿也退不动（实测跑满 10s 失败），
      # 更早发现它没有意义。
      movement_time_allowance: 10.0
    # Goal checker parameters
    # yaw_goal_tolerance 由 0.25 放宽到 0.6：阿克曼车难以在目标点把朝向对准到 0.25rad。
    # 路点推进实际由主程序的 2.15m 距离阈值决定，不依赖该朝向容差。
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.6
      stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.6
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # 阿克曼可行域：车不能原地转。**实际生效的舵角上限是 ±0.6 rad**——URDF 的
      # left/right_steering_hinge_joint limit 写的是 ±1，但真正在跑的 nav_sim
      # （tianracer_gazebo/scripts/transform.py，参数 max_steering_angle: 0.6）
      # 在换算后把舵角钳到 ±0.6 才下发，所以 ±0.6 才是有效限位。
      # transform.py 做 δ = atan(L·ω/v)，L=0.26 -> 转弯半径 R = L/tanδ = v/ω。
      #
      # 为什么要把 max_vel_theta 由 1.0 提到 4.7（2026-09-12 实测）：原值 1.0 与
      # min_vel_x 0.4 是自洽的（tan(0.6)/L×0.4 = 1.05），但那只在低速成立——
      # R = v/ω，ω=1.0 意味着 **R ≥ v**：车速一到 2.5 m/s 就需要 R=2.5m，
      # 而赛道净宽仅 0.96m，这个弯物理上拐不过去（实测：车以 1.90 m/s 冲进
      # (-4,-8) 附近的弯角后卡死 17.8s；改成 4.7 后同一弯角以 0.10m 贴近距离通过）。
      # 提到 4.7 后低速段会出现 ω > 2.63·v 的采样对，被 transform.py 钳到 ±0.6
      # （车实际转得比 DWB 预测更宽，靠反馈 critics 修正）——属可接受的软代价。
      #
      # min_vel_x 不随之抬高（**已实测权衡**）：严格自洽要求 max_vel_theta ≤ 2.63×min_vel_x，
      # 但那会要求 min_vel_x ≥ 1.8，而实测把 min_vel_x 由 0.4 抬到 0.8 就出现致命退化——
      # 车贴近障碍时 `No valid trajectories out of 420!` ×112（420 条候选 100% 撞致命格，
      # 因为 v≥0.8 的弧线全部出自由区），既不能脱困也不能蠕动，被裁判 10s 未移动判据终止。
      # 采样不自洽是软代价，失去低速可机动性是硬故障，故只把地板抬到安全区上沿。
      # ⭐ 定稿 0.6（2026-09-13，方案1「抬地板」）：
      # 0.7 系上边界探测（99.45s / 104.52s，均值 102.0s），与 0.6（均值 103.0s）
      # 统计上无差别、离 0.8 致命悬崖更近（齿尖 vx≥0.8 弧线 100% 撞致命格先例），
      # 故取 0.6。相比原 0.4：实测快约 8s（111.25 → ~103s），钉地板占比 20.9%→~15%，
      # 减速段 11→~1（仅终点），NVT/THO 计数与 0.4 完全相同。
      # ── 2026-09-18 raicom 专属档：min_vel_x 0.6 -> 0.4（实验⑧）──────────
      # （上面「⭐ 定稿 0.6」是**默认赛道**的结论，本赛道单独改，理由见下。）
      # 动因：@2.0 五轮实测 **2/5 完赛**（基线 @1.5 为 4/5）。三轮失败**全是卡死**：
      #   v20_1 停在 (1.70,−4.27) 被「10s 未移动」判停；v20_4 / v20_5 在 map(7,6)
      #   卡住后撞「30s 未检测到检查门」超时（v20_5 结束时 cmd_vx 恰为 0.000）。
      # ★ 关键证据（把 NVT 对齐到车速/位置，**推翻了先前"视界 1.6m 扫进墙"的假设**）：
      #   NVT 发生在**低速/停车**时——v20_5 有 85% 的 NVT 事件 vx<0.8、中位 **0.000**；
      #   且高度聚集：260 次里 **152 次在同一个 1m 格 map(7,6)**。基线轮 NVT = **0**。
      #   ⇒ NVT 是「420 条候选全非法、车一步都不能动」的**症状**，不是原因。
      # 机理（本文件自身已有同类记录）：上面 0.4->0.8 那段记载过，地板抬高后出现
      #   `No valid trajectories` ×112，原因是「v≥0.8 的弧线**全部出自由区**」。
      #   ⇒ 反过来：**更慢的弧线更容易留在自由区内**。raicom 是自由域仅 0.73% 的窄带
      #   赛道（通道约 0.7~0.9m），且两处 chicane 有 0.1m 厚的碎墙块（(7,6) 的
      #   x≈7.0/7.2 短墙、(1.3~1.5,−4.7~−4.8) 碎块）⇒ 降到 0.4 给 DWB 补上能蹭出来的慢候选。
      # ⚠️ 归因注意：DWB 的候选栅格 = min + k·(max−min)/(vx_samples−1)，故本改动
      #   **不只是"增加慢候选"，而是整体重排栅格**（0.4+k·0.0842 vs 0.6+k·0.0737）。
      #   若均速下降，须区分「慢候选被选得多」与「栅格点整体位移」两种原因。
      # ⚠️ 代价：默认赛道实测 0.4->0.6 快约 8s ⇒ 本改动预计牺牲一点速度，
      #   换「卡死后能脱困」。若 0.4 仍无法脱困，下一步改试 global inflation_radius
      #   0.3->0.45（r1 上对付同类贴墙死锁的已验证修法）。
      min_vel_x: 0.4
      min_vel_y: 0.0
      # ── 2026-09-18 raicom 专属档：max_vel_x 1.5 -> 2.0（单一概念：抬速度上限）──
      # 实测依据（rc_base2_* 基线 5 轮 @1.5）：vx_nav **中位 = 1.500** = 候选栅格
      #   顶点（0.6 + 19×0.0474），**51.1%** 的帧精确贴顶，连 |wz|≥1.0 的急弯桶
      #   （222 帧）中位也是 1.500 ⇒ **上限自身在卡速度**。
      #   对照 racetrack_1：那里上限 3.0 时车选 2.4947（**非**顶点）⇒ 真平台在
      #   2.495；raicom 选的是顶点 ⇒ 真平台 ≥1.5、被上限钳住，抬上限才测得出来。
      # ── 实验⑩（2026-09-18）max_vel_x 2.0 -> 2.5 ── ❌ 失败，已回退 ─────────
      # 假设：@2.0 时 57~59% 的帧精确贴顶 2.000 ⇒ 真平台 ≥2.0，抬上限仍应有收益。
      # 结果（5 个有效轮，**0/5 完赛**）：**0/3/3/2/1 门**，全在第一圈内就卡死
      #   （move_dis 仅 14.8~59.9m），NVT **78~380**、撞格 39~190。
      # ★ 关键指纹——**贴顶比例反而下降**：`vx_nav` 中位 0.000~1.505、
      #   均值 0.38~1.46、贴顶比例 **9.5~33.7%**（@2.0 档是 中位 2.000 / 均值 1.546 / **58.5%**）。
      #   ⇒ 这说明 2.5 **不是"多了一个更快的选项"，而是超出了这条赛道的可用能力**：
      #     视界随 vx 拉到 2.0m（0.8×2.5）后，快候选的弧线大面积扫出 0.7~0.9m 的自由带
      #     ⇒ 快候选几乎全非法 ⇒ 车连 2.0 都跑不出来，长期钉在地板上。
      # ⇒ **raicom 的可用上限就在 2.0 附近**（对照：racetrack_1 能跑 2.5，是因为它的
      #   自由带更宽、chicane 更缓；同样是 2.0m 视界，r1 稳定 9/9 而 raicom 0/5）。
      # ⚠️ 因此「2.0m 视界在 r1 上没问题」**不能外推到 raicom**——上限是赛道几何的函数。
      # 回退理由：配置写 2.5 而行为是"连 2.0 都跑不出"，留着只会造成归因混乱。
      max_vel_x: 2.0
      max_vel_y: 0.0
      max_vel_theta: 4.7
      min_speed_xy: 0.0
      # 随 max_vel_x 同步（DWB 的 max_speed_xy 是合成线速度上限，不跟着改等于没改）
      max_speed_xy: 2.0
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      # 轨迹地平线（轨迹长度 = sim_time × 速度）。
      # 原 1.7 配当时更高的速度上限时，轨迹远超赛道净宽，273 条候选 100% 撞致命格
      # （日志 "1.00: BaseObstacle/Trajectory Hits Obstacle."），车陷死区原地不动。
      # 0.8 × 1.5 = 1.2m 可产生有效轨迹（基线 113.61s / 9-9 门）。
      #
      # ⚠️ 2026-09-13 实测：试过 1.2（方案 A，想靠更长视界越过西侧走廊的横墙齿，
      # 让 DWB 规划连续 S 形以减少「锯齿式减速」）——**失败，已回退，勿再试**。
      # 结果：0/9 门、11.93m、25.42s 被判停车，卡在西侧走廊第二道齿尖
      # (-1.78, 2.68)（该齿向东延伸到 x≈-1）。视界 1.8m 让齿尖处所有候选轨迹
      # 都撞格：`No valid trajectories` 22→116（5.3×）、`Trajectory Hits Obstacle`
      # 11→58（5.3×）、`failed to create plan` 0→3。
      # 结论：**这条走廊要求 DWB 的视界保持短**；视界越长，齿尖处越没有可行弧线。
      # 减速是走廊几何的必然结果，不是能靠调视界消除的配置问题。
      #
      # ── 实验⑨（2026-09-18）sim_time 0.8 -> 0.6 ── ❌ 大倒退，已回退 ─────────
      # 假设：视界 = sim_time × vx，抬 vx 等于偷偷拉长视界（1.2m -> 1.6m）⇒ 快候选
      #   扫进 chicane 碎墙块 ⇒ 车只能爬。故把 sim_time 降到 0.6，令 2.0 m/s 的视界
      #   回到 1.2m（= `0.8 × 1.5` 那个已验证值），期望既解 chicane 又保速度。
      # 结果（5 个有效轮，**0/5 完赛**，全部撞 30s 过门超时；多数在 35~43m 就卡死）：
      #   NVT **160 / 310 / 320 / 716 / 164**（上一档是 16~196），
      #   `vx_nav` **中位塌到 0.400（= 地板）**、均值 0.69~0.82、
      #   贴顶比例 **15~18%**（对照 sim_time 0.8 时是 中位 2.000 / 均值 1.546 / **58.5%**），
      #   且 NVT 散布到 (7,−3)/(9,−2)/(10,0)/(2,5)/(6,5) 等**许多不同位置**，
      #   不再限于两个 chicane（90% 的 NVT 帧 vx<0.8、中位 0.000 ⇒ 停下时全候选非法）。
      # ★ 结论（本条推翻了我先前的假设）：**视界长度不只是"可行性旋钮"，它是速度选择的
      #   驱动量**——轨迹越短，PathDist/GoalDist 这类"推进型"critic 累积越少，
      #   判据退化为"障碍代价最小 = 最慢"，于是车长期钉在地板上、几乎不用快候选。
      #   ⇒ **视界不能为了换 chicane 间隙而缩短**，否则先把速度杀死。
      # ⚠️ 已核实参数真生效：st6_2 / st6_5 的 `params_loaded.txt` 读到 `sim_time = 0.6`、
      #   mv4 读到 `0.8`。（该文件里参数读空是 `ros2 param get` 5s 超时导致的**随机**
      #   现象，mv4 与 st6 各有 2~3 轮读空，不能据此判断参数没生效。）
      sim_time: 0.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      # 去掉 RotateToGoal / GoalAlign：二者奖励「原地转向对准目标朝向」，而阿克曼车
      # 既不能原地转（vx ≥ min_vel_x）又受 ±0.6rad 舵角限位（transform.py 钳位）约束，留着只会持续产生
      # 不可行轨迹，是 "No valid trajectories" 的主要来源之一。
      # BaseObstacle.scale 0.02 -> 0.3：原值几乎不给障碍代价权重，车贴着膨胀层走；
      # 提高后轨迹会主动避开高代价区，减少「贴墙进死区」。
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist"]
      # ⚠️ BaseObstacle.scale 保持 0.3：2026-09-13 试过降到 0.15（想缩小快慢档的
      # BaseObstacle 差距——慢档轨迹短、离墙远，BO 恒为 0 白占便宜），**实测倒退**：
      # 112.16s 对 goal36 的 111.25s。西侧蛇形第 4 段 1.08→1.00（退）、第 7 段
      # 1.03→1.08（进），两段互相抵消、整体略差。**故回退，勿再试。**
      BaseObstacle.scale: 0.3
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      # GoalDist.scale 24.0 -> 36.0（2026-09-13，**实测最优，保留**）。
      #
      # 实测：三圈 9/9 门 / 111.25s，对比原值 24 的 113.70s —— 快 2.45s（2.2%）。
      # 改善集中在西侧「梳齿蛇形」走廊（减速最密集处）：第 4 段 0.96→1.08（+12.5%）、
      # 第 7 段 1.00→1.03；其余段持平。减速段由 15 段/25.7s 降到 11 段/22.8s。
      #
      # 依据（用 dwb_recorder 抓 DWB 每周期全部候选的得分后实测）：
      #   精确公式 total = 0.30·BaseObstacle + 0.80·PathAlign + 0.80·PathDist
      #                        + 0.60·GoalDist   （6026 条合法轨迹最小二乘，残差 0）
      # 即 yaml 的 scale 0.3/32/32/24 对应的实际权重是 0.3/0.8/0.8/0.6——
      # 三个「距离类」critic 的 raw_score 被 DWB 除以了 40（消息自带的 critic_scales
      # 字段可证：yaml 36 对应消息 scale 0.9）。改 yaml 值前务必按 /40 换算。
      #
      # ⚠️ **但 36 并未根治问题**：11 个减速现场仍全部是「软代价」——实选恒为
      # min_vel_x=0.40，而满速 1.50 的可行解就在候选集里（可行候选 420/420）。
      # 修正口径后的反事实扫描（用消息 scale、过滤 total<0 的非法轨迹哨兵）显示：
      #   w_goal 0.2~0.9（yaml 8~36）全部仍选 0.40；需 ≥1.2（yaml 48+）才升到 0.81。
      # 深层原因是 **sim_time × vx 的耦合**：慢速轨迹只穿越 0.32m、天然离障碍远且
      # 无需转向，故其总分结构性更低。**只调 critic 权重无法对抗这个几何事实。**
      GoalDist.scale: 36.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_namespace>/odom
      robot_base_frame: <robot_namespace>/base_link
      use_sim_time: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # 以下三项对齐 ROS1 tianracer_navigation/param/teb_carlike/costmap_common_params.yaml：
      # inflation_radius 0.3、cost_scaling_factor 10.0，且原版未设 robot_radius（用 costmap 默认 0.1）。
      # 本文件此前由 TurtleBot3 Nav2 模板抄来，三项被放大到 2.5 / 8.0 / 0.305，在 0.96m 宽的
      # 赛道里会把走廊压成零自由代价格，导致 DWB「No valid trajectories」。
      # 局部代价地图由 3x3 放大到 6x6（原版 4x4）：DWB 需要看到足够远的转弯才能规划过弯。
      # robot_radius 0.1 -> 0.07：URDF 车体为 0.28x0.10 的 box（半宽仅 0.05），0.1 相当于
      # 把内切半径放大一倍，致命带随之变宽、窄道里更容易出现死区。
      robot_radius: 0.07
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: <robot_namespace>/map
      robot_base_frame: <robot_namespace>/base_link
      use_sim_time: true
      # 同 local_costmap：对齐 ROS1 原版（inflation_radius 0.3、cost_scaling_factor 10.0），
      # robot_radius 由模板的 0.305 降到 0.07（URDF 车体 0.28x0.10，半宽 0.05）
      robot_radius: 0.07
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "turtlebot3_world.yaml"
    map_topic: /<robot_namespace>/map
    frame_id: <robot_namespace>/map

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 对齐 ROS1 tianracer_navigation/param/teb_carlike/global_planner_params.yaml：
      #   allow_unknown: false          # 原版明确关闭，注释指出须配合 track_unknown_space: true
      #   default_tolerance: 0.1
      #   use_dijkstra: true
      # 本图 87.9% 为未知区，allow_unknown: true（模板默认）会让规划器穿未知区抄近路、
      # 绕开真实赛道与检查门；关闭后路径被约束在已建图的赛道内。
      tolerance: 0.1
      use_astar: false
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: <robot_namespace>/odom
    robot_base_frame: <robot_namespace>/base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

# 本段此前缺失，导致 velocity_smoother 节点吃 Nav2 编译期默认 max_velocity [0.5, 0, 2.5]
# ——实测 cmd_vel.x 最大值恰好 0.500，DWB 与 TEB 的局部规划器限速都被它压在下面，
# 这是「车速上不去」的真正原因（`navigation_launch.py:259-263` 把 cmd_vel_smoothed
# 重映射为 cmd_vel，即平滑器在控制链路上，不可绕过）。
# max_accel/max_decel 与 DWB 的 acc_lim/decel_lim 对齐，避免平滑器引入额外限速。
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # ── 2026-09-18 raicom 专属档：跟随 max_vel_x 1.5->2.0，wz 上限同步 2.5->3.33 ──
    # **smoother 在控制链路上**（cmd_vel_smoothed 被重映射为 cmd_vel），它的限幅是硬限。
    # wz 必须同步抬：物理上 wz = v·κ，同一弯道提速就必须提高偏航率。
    #   实测 wz 上限确在生效——`wz_cmd` 最大值恰好等于本处设定（2.500 / 3.330），
    #   而 `wz_nav` 一直能到 4.478~4.700（规划器想要的比 smooth 放行的更大）。
    #   raicom 最紧弯按 **R 0.60m** 跑；若只抬 vx 不抬 wz，同弯 R 会变大 ⇒ 切弯/推头。
    #   故取 **3.33 = 2.0/0.60**，即「保持原有最小转弯半径不变」。
    # 实验⑩ 曾随 max_vel_x 2.5 同步抬到 4.17（同一条不变量），但那一档整体失败
    #   （0/5，见 FollowPath 段实验⑩注释），已连同 vx 一起回退。
    max_velocity: [2.0, 0.0, 3.33]
    min_velocity: [-2.0, 0.0, -3.33]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200