# =============================================================================
# MPPI 局部规划器参数（允许倒车组）
# =============================================================================
# 本文件由 tools/gen_mppi_params.py 从 navfn_dwb_nav2_params.yaml 生成：
#   **除 controller_server.FollowPath 段外，其余与 DWB 文件逐字节相同**
#   —— velocity_smoother / costmap（robot_radius 0.07、local 6x6）、AMCL、
#      planner_server（NavFn）、各 use_sim_time 等公共段原样保留。
# 目的：让「DWB vs MPPI」的对比只差局部规划器本身，不掺其他配置差异。
#   重新生成：python3 tianracer_navigation2/tools/gen_mppi_params.py
#
# 运行：ros2 launch tianracer_navigation2 nav2.launch.py use_planner=navfn_mppi
#
# 【与 DWB 文件的关键对齐点（速度直接到位）】
#   vx_max 1.5 / wz_max 3.95  —— 对齐 DWB 定稿（= 1.5·tan(0.6)/0.26）
#   motion_model Ackermann + min_turning_r 0.38
#                            —— 0.38 是本项目的物理极限（见下面 FollowPath 段注释）
#   vx_min -0.35 —— **允许倒车**（历史较差）
# =============================================================================
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    base_frame_id: <robot_namespace>/base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 1.0
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: <robot_namespace>/map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 3000
    min_particles: 500
    odom_frame_id: <robot_namespace>/odom
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # 运动模型：差分（Ackermann 车不能横移；对齐 ROS1 odom_model_type=diff）
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    # 启动即自动定位：AMCL 在 configure 阶段直接采用该位姿，无需再发 /initialpose 话题。
    # 注意：出生位姿由 nav2.launch.py 按 world:= 从 track_spawn.py 注入，此处数值仅作未注入时的回退。
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.54

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: <robot_namespace>/map
    robot_base_frame: <robot_namespace>/base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # ⚠️ 10.0 是实测后的定稿值，**不要下调**。2026-09-17 曾试过降到 4.0，理由是该值
      # 恰好等于裁判的 stop_time_threshold = 10.0s（judge.launch.py），两个计时器同时
      # 起步、裁判必然先到。但实跑证明这是**显著回归**：4.0 组完赛 2/8，10.0 组 6/7
      # （Fisher p≈0.04）。因为窗口缩小 2.5 倍使「无进展」判定触发频率大增，每次恢复
      # 都会清代价地图并后退 0.35m，车因此更容易被推进 test_indoor 的 (-1.77, 3.78)
      # 死角——那里前进/倒车**双向锁死**，进入必然丢轮。
      # 而且下调本就治不了那个死角：BackUp 自己在那儿也退不动（实测跑满 10s 失败），
      # 更早发现它没有意义。
      movement_time_allowance: 10.0
    # Goal checker parameters
    # yaw_goal_tolerance 由 0.25 放宽到 0.6：阿克曼车难以在目标点把朝向对准到 0.25rad。
    # 路点推进实际由主程序的 2.15m 距离阈值决定，不依赖该朝向容差。
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.6
      stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.6
    # DWB parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # ---- 采样与优化核心 ----
      # time_steps x model_dt = 预测时域 = 56 x 0.05 = 2.8s
      #   比 DWB 的 sim_time 0.8s 长 3.5 倍 —— MPPI 的核心优势（看得更远）。
      #   DWB 的地平线受「sim_time x vx」耦合限制（快轨迹长、慢轨迹短，导致
      #   弯中停车更划算），MPPI 的时域不随 vx 变化，理论上不会重现该机制。
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000          # 每周期采样 2000 条候选（DWB 是 420 条）
      iteration_count: 1        # MPPI 官方建议保持 1；>1 收益小且耗时
      # ---- 采样噪声标准差（探索幅度）----
      # vx_std 曾试 0.1（2026-09-14）以消除「爬行段」，**部分成功但总体退步，已回退**：
      #   爬行段(0.05~0.3) 确实从 7.5% 降到 1.9%（目标达成），
      #   但 >=1.0 占比从 32.4% 掉到 **0%**，里程 25.08 -> 20.54m。
      #   机制：vx_std 是采样探索幅度，收窄后 MPPI 难以探索到高速候选，
      #   softmax 平均随之被拉低 —— 它与 deadband 是**对抗关系**
      #   （deadband 把速度往高推，vx_std 决定能否采到高速样本）。
      #   故保持官方默认 0.2，速度靠 deadband 抬。
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # ---- 速度/加速度硬边界 ----
      # 对齐 DWB 定稿：vx_max 1.5 / wz_max 3.95 = 1.5·tan(0.6)/0.26，
      #   即 transform.py 舵角钳位 (±0.6rad) 与轴距 0.26 决定的上限。
      # ── 实验⑦（2026-09-18）：高速档 vx_max 3.0 / wz_max 7.89 / deadband 2.5 ──
      #   **实测失败已回退**（mppi2，默认赛道可视化跑，0/9）：车撞墙、速度失控
      #   （速度中位 0.300、最大 2.110 m/s 剧烈振荡），里程仅 10.24m，
      #   `Optimizer fail to compute path` ×9、`follow_path Aborting handle` ×9。
      #   机制：deadband 是**全局统一的速度设定点**，权重 35 对每一步、每个位置都施加；
      #   弯道里 CostCritic（3.81）压不住它 ⇒ 车被推进弯道贴墙 ⇒ 优化器无可行解。
      #   与 DWB 的 min_vel_x 同属「一个全局速度设定点无法同时服务直道与弯道」，
      #   只是 MPPI 表现为失控而非"无可行解帧"。历史对照：deadband 1.0 时巡航
      #   0.813 m/s、最好 3/9、从未走通 9 门；而 DWB 是 2.495 m/s 稳定 9/9
      #   ⇒ **MPPI 提速方向关闭，别再试中间值**。
      # ⚠️ 该轮的另一处教训：本生成器基座是**通用** navfn_dwb 文件（smoother 线速度
      #   1.5），实验⑦ 曾把 vx_max 抬到 3.0 却漏改 smoother，使「规划器以为能跑
      #   3.0、实际被钳到 1.5」——mppi1 轮因此作废（cmd_vx 上限恰好 1.500、
      #   27.6% 的帧贴着它）。今后再动 vx_max，务必同步改公共段的
      #   velocity_smoother max|min_velocity[0]。
      vx_max: 1.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 3.95
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      # ---- 软最大熵加权（MPPI 特有）----
      # temperature 越小越"贪心"选最优候选（趋于确定性）；越大越平滑但迟钝。
      # gamma 是候选代价的折扣/归一化系数。
      # 曾试 0.15（2026-09-14）以缩短起步爬升，**两轮无收益已回退**：
      #   机制假设成立——起步首次运动确实由 4.32s 提前到 2.97s（达 DWB 的 2.95s），
      #   因为 MPPI 的慢起步不是加速度限制（ax_max 3.0 已宽于 DWB 的 acc_lim_x 2.5），
      #   而是 **softmax 平均**：零速初值时 2000 条候选多数接近 0，被平均掉。
      #   但首门成绩反过来变差（t1 2/9，t2 0/9，且 t2 里程仅 12.77m 卡在北侧弯），
      #   而 temp 0.3 的四轮为 2/3/0/0。两轮不足以定论方差，且首门余量仍卡在 0~2.4s，
      #   故回退官方默认 0.3。
      temperature: 0.3
      gamma: 0.015
      # ---- 运动模型 ----
      # Ackermann：显式建模阿克曼约束（DWB 靠 vtheta 采样间接近似）。
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.38     # 本项目物理极限：L/tan(0.6) = 0.26/0.684 = 0.38
      # ---- 路径与可视化 ----
      # prune_distance 曾试 3.0（2026-09-14）以抬高参考路径末端、期望抬高巡航速度，
      # **实测证伪**：prune 1.7 与 3.0 的开阔段巡航都是 0.55~0.65，无语义差别
      # （a1@1.7 直道 0.592，f1@3.0 直道 0.55~0.67）。曾据 a1「±0.001 窄带」
      # 与 1.7/2.8=0.607 的 2.5% 吻合推断「vx* = prune/时域」是控制平衡点，
      # 该推断被 f1 推翻——那个窄带只是那段恰好直行的巧合，属过度解读。
      # 且 prune 3.0 + 允许倒车（b1）会诱发**全程倒车 3.4m**（cmd_vx 均值 -0.107，
      # 走向 -Y），而 1.7 + 允许倒车（a1）是向前。故退回 1.7。
      prune_distance: 1.7
      transform_tolerance: 0.1
      visualize: false
      reset_period: 1.0         # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      # ---- critics ----
      # 与 DWB 的五个 critic 大致对应：
      #   GoalCritic/GoalAngleCritic   <-> GoalDist
      #   PathAlignCritic/PathFollowCritic/PathAngleCritic <-> PathAlign/PathDist
      #   CostCritic                   <-> BaseObstacle
      #   PreferForwardCritic          <-> （DWB 无对应；对应 TEB 的
      #                                     weight_kinematics_forward_drive，
      #                                     即"偏好前进"的软手段）
      #   ConstraintCritic             <-> （DWB 无对应；软惩罚越界）
      #   VelocityDeadbandCritic       <-> min_vel_x（★关键：DWB 的速度地板）
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # 必须为 false：本项目的 local_costmap 用 robot_radius 0.07（圆形），
        # **没有 footprint 多边形**。设 true 会让 controller_server 在 configure
        # 阶段直接抛 "Considering footprint in collision checking but no robot
        # footprint provided in the costmap" 并 bringup 失败（实测）。
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # 判别实验：14.0 -> 0.0（等价禁用）。假设：prune_distance 1.7m 截断参考路径，
        # 而轨迹长度=时域(2.8s)x vx，vx>0.6 起评价点落到路径末端之外，
        # PathAlign 惩罚随 vx 单调上升 -> 与 deadband(推高) 在 0.8~1.0 形成平衡
        # （实测 vx 众数 0.8~1.0、从未 >1.2，恰在死区下沿，与此吻合）。
        # 若禁用后速度上升到 1.2+，假设成立；若不变，压制来自其他 critic。
        cost_weight: 0.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # ★ VelocityDeadbandCritic —— DWB min_vel_x 的 MPPI 等价物（2026-09-14 加入）
      # 源码（velocity_deadband_critic.cpp，已核）：
      #   cost += sum( max(|deadband_vx| - |vx|, 0) ) * model_dt * weight
      # 即**惩罚 |vx| < deadband_vx 的候选**，把速度推离低速区。
      #
      # 为什么必须加：MPPI 架构上**没有速度地板**——
      #   DWB  : 固定速度采样对（min_vel_x 0.6 … max_vel_x 1.5）+ 硬地板
      #   MPPI : 高斯采样（vx_std 0.2）+ softmax 软平均，无任何下限机制
      # 实测对照（同一条赛道、同一卡点）：
      #   开阔段  DWB 1.29  vs  MPPI 0.55~0.65
      #   窄弯段  DWB 1.50  vs  MPPI 0.03~0.19（掉速后触发 Failed to make progress → abort）
      #   cmd_vx vs |wz| 分桶：DWB 全程 1.24~1.41 平坦（地板撑住）；
      #                       MPPI 直行 0.56 → w=0.1 桶 0.24 → w=0.2 桶 0.28
      # 注意 deadband 是 |vx| 上的死区：对 vx_min<0 的允许倒车组，低速倒车同样被罚
      # （官方文档：a zero array means the critic will take no action）。
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0            # 官方默认；比其余 critic 高一个量级，属预期
        # 历史实测映射：deadband 0.6 -> cmd_vx 均值 0.593；1.0 -> 0.813（单调）。
        # ★ 实验⑦ 曾试 2.5（2026-09-18）：**失败已回退**——车撞墙失控、0/9。
        #   它是全局统一的速度设定点，弯道里压不住 CostCritic（见上「速度硬边界」段）。
        deadband_velocities: [1.0, 0.0, 0.0]

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_namespace>/odom
      robot_base_frame: <robot_namespace>/base_link
      use_sim_time: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # 以下三项对齐 ROS1 tianracer_navigation/param/teb_carlike/costmap_common_params.yaml：
      # inflation_radius 0.3、cost_scaling_factor 10.0，且未设 robot_radius（用 costmap 默认 0.1）。
      # 本文件此前由 TurtleBot3 Nav2 模板抄来，三项被放大到 2.5 / 8.0 / 0.305，在 0.96m 宽的
      # 赛道里会把走廊压成零自由代价格，导致 DWB「No valid trajectories」。
      # 局部代价地图由 3x3 放大到 6x6（原为 4x4）：DWB 需要看到足够远的转弯才能规划过弯。
      # robot_radius 0.1 -> 0.07：URDF 车体为 0.28x0.10 的 box（半宽仅 0.05），0.1 相当于
      # 把内切半径放大一倍，致命带随之变宽、窄道里更容易出现死区。
      robot_radius: 0.07
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: <robot_namespace>/map
      robot_base_frame: <robot_namespace>/base_link
      use_sim_time: true
      # 同 local_costmap：inflation_radius 0.3、cost_scaling_factor 10.0，
      # robot_radius 由模板的 0.305 降到 0.07（URDF 车体 0.28x0.10，半宽 0.05）
      robot_radius: 0.07
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "turtlebot3_world.yaml"
    map_topic: /<robot_namespace>/map
    frame_id: <robot_namespace>/map

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 对齐 ROS1 tianracer_navigation/param/teb_carlike/global_planner_params.yaml：
      #   allow_unknown: false          # 明确关闭，须配合 track_unknown_space: true
      #   default_tolerance: 0.1
      #   use_dijkstra: true
      # 本图 87.9% 为未知区，allow_unknown: true（模板默认）会让规划器穿未知区抄近路、
      # 绕开真实赛道与检查门；关闭后路径被约束在已建图的赛道内。
      tolerance: 0.1
      use_astar: false
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: <robot_namespace>/odom
    robot_base_frame: <robot_namespace>/base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

# 本段此前缺失，导致 velocity_smoother 节点吃 Nav2 编译期默认 max_velocity [0.5, 0, 2.5]
# ——实测 cmd_vel.x 最大值恰好 0.500，DWB 与 TEB 的局部规划器限速都被它压在下面，
# 这是「车速上不去」的真正原因（`navigation_launch.py:259-263` 把 cmd_vel_smoothed
# 重映射为 cmd_vel，即平滑器在控制链路上，不可绕过）。
# max_accel/max_decel 与 DWB 的 acc_lim/decel_lim 对齐，避免平滑器引入额外限速。
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 2.5]
    min_velocity: [-1.5, 0.0, -2.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200