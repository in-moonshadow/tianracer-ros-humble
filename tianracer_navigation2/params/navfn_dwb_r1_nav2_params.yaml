# =============================================================================
# racetrack_1 专用变体：**只把速度上限由 1.5 抬到 2.0**，其余与 navfn_dwb 完全一致。
#
# ⭐ 定稿 2.0（2026-09-15）。下面是完整依据，含一次被否证的更快尝试——不要重蹈。
#
# ── 为什么需要这份文件 ────────────────────────────────────────────
#   racetrack_1 的赛道尺度是基准赛道的 2.5 倍：相邻检查门中心直线距 19.3 / 21.3 m
#   （基准 7.8 / 8.0 m），第 2→3 门赛段**至少 51.7 m**。而裁判的
#   checkpoint_timeout = 30s 是**官方规则值、不能改**（judge_system.py:57）。
#   要在 30s 内跑完 51.7 m 需均速 ≥1.7 m/s。
#
#   原配置 max_vel_x = 1.5 时车**全程顶格**（该段 75% 采样 ≥1.45 m/s、中位 1.477、
#   最大 1.516；低于 1.0 的仅 1%），没有可回收余量 ⇒ 唯一的杠杆是抬上限。
#   结果：原配置两轮**完全相同的 2/9**（确定性故障）；抬到 2.0 后 **5/5 完赛**，
#   关键赛段降到 26.6~27.9s（余量 2.1s）。
#
# ── 为什么不再往上抬（2.5 被否证）────────────────────────────────
#   速度分公式 speed_score = 35 * min(1, 42/总用时)（judge_system.py
#   _compute_speed_score）：**与总用时成反比、42s 才封顶**。
#   318m 的赛道要 42s 跑完需 7.6 m/s（不可能）⇒ 收益线性、不饱和，故 2.5 值得一试。
#
#   实测 2.5 只有 **3/5 完赛**，期望分 46.2 < 2.0 的 58.9。⚠️ 判据是**期望分**不是
#   完赛率：完赛时 2.5 只多拿 +1.49 分（60.35 vs 58.86），失败一轮却掉 19~49 分
#   （8/9 得 40、2/9 得 10）。这个**不对称**不依赖显著性检验，比拿比率说事稳
#   （5/5 vs 3/5 的 Fisher p=0.444，n=5 太小）。
#
#   失败**固定在同一处**：d2 门后约 4.9 m 的那个弯。五次 2.5 配置的失败点位
#   (7.453,-16.204) (7.43,-16.11) (7.37,-15.90) (7.38,-16.48) (7.38,-16.48)
#   ——互距 ≤0.5 m。对照：@2.0 干净轮经过该处的车姿是 (7.45,-16.16)，
#   **与失败点仅差 0.02 m** ⇒ 两种配置的车线在**几何上重合**，差异纯粹是动力学的。
#
# ── ★ 一次被否证的假设（记录下来，避免重蹈）─────────────────────
#   曾假设：DWB 的 max_vel_theta=4.7 被 velocity_smoother 的 max_velocity[2]=2.5
#   钳位（规划层 4.7 vs 执行层 2.5 不一致），车实际转得比计划宽 → 跑宽贴墙。
#   链路核实无误（nav2_bringup 把 controller_server 发到 cmd_vel_nav、
#   velocity_smoother 订阅后发布到 /cmd_vel，而 cmd_vel_to_ackermann_drive 读
#   /cmd_vel ⇒ 平滑器确实在链路里）；改动也**确实生效**（|cmd_wz| 由硬顶 2.500
#   变为最大 3.504），但结果是 **0/5 完赛**、期望分 19.0，Fisher vs 2.0 **p=0.008**，
#   显著更差。NVT 从 38/48 涨到 70/74。
#   ⇒ **那道 2.5 钳位一直在起保护作用**：DWB 在低速段会采样 ω > 2.63·v 的对，
#     被 transform.py 钳到 ±0.6，车本来就跟不上；放开后这些"车执行不了的"指令
#     真的发出去了，跟踪误差反而变大。**教训：看起来无疑的"配置不一致"，
#     改之前要先想清楚它是否在无意中起到了正确的约束。**
#
# ── 仍未解决的机理（留给后来者）─────────────────────────────────
#   那个弯**为什么在 2.0 稳过、2.5 就栽**，目前**没有已验证的机理**。已排除：
#     · ω 钳位（上面，已被 p=0.008 否证）
#     · 抓地力不足：生效模型 tianracer_run.xacro → tianracer.xacro →
#       racecar.gazebo 里四轮 μ=2.0，则该弯不滑的最高速为 sqrt(2·9.81·0.38)=2.73 m/s
#       > 2.27 m/s，不构成限制
#     · 地图错位：车恰好位于「自由/未建图」边界上，dist=0 只表示**地图知识在此终止**
#       （左侧是 SLAM 未建到的区域），不等于"车在墙里"。自由走廊约 1.3 m 宽。
#   下一步建议：用 costmap 抓取工具在车卡住那一刻抓 /local_costmap/costmap，
#   直接看 footprint 余量与周围致命格分布（局部代价地图走 odom 系、只用激光，
#   不含地图，故能反映真实几何）。
#
# ── 为什么单独一份、不改原文件 ───────────────────────────────────
#   基准赛道 tianracer_racetrack 有一条 0.98m 窄道，本就容易卡死；全局提速很可能让它更糟。
#   故按赛道分档，而不是改通用档。
#
# 只改「速度上限」这一个概念（max_vel_x / max_speed_xy / smoother 的 max|min_velocity），
# **不动加速度**。注意平滑器角速度上限**保持 2.5**（见上面的否证）。
# =============================================================================
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    base_frame_id: <robot_namespace>/base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 1.0
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: <robot_namespace>/map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 3000
    min_particles: 500
    odom_frame_id: <robot_namespace>/odom
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # 运动模型：差分（Ackermann 车不能横移；对齐 ROS1 odom_model_type=diff）
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.2
    update_min_d: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    # 启动即自动定位：AMCL 在 configure 阶段直接采用该位姿，无需再发 /initialpose 话题。
    # 注意：出生位姿由 nav2.launch.py 按 world:= 从 track_spawn.py 注入，此处数值仅作未注入时的回退。
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.54

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: <robot_namespace>/map
    robot_base_frame: <robot_namespace>/base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # ⚠️ 10.0 是实测后的定稿值，**不要下调**。2026-09-17 曾试过降到 4.0，理由是该值
      # 恰好等于裁判的 stop_time_threshold = 10.0s（judge.launch.py），两个计时器同时
      # 起步、裁判必然先到。但实跑证明这是**显著回归**：4.0 组完赛 2/8，10.0 组 6/7
      # （Fisher p≈0.04）。因为窗口缩小 2.5 倍使「无进展」判定触发频率大增，每次恢复
      # 都会清代价地图并后退 0.35m，车因此更容易被推进 test_indoor 的 (-1.77, 3.78)
      # 死角——那里前进/倒车**双向锁死**，进入必然丢轮。
      # 而且下调本就治不了那个死角：BackUp 自己在那儿也退不动（实测跑满 10s 失败），
      # 更早发现它没有意义。
      movement_time_allowance: 10.0
    # Goal checker parameters
    # yaw_goal_tolerance 由 0.25 放宽到 0.6：阿克曼车难以在目标点把朝向对准到 0.25rad。
    # 路点推进实际由主程序的 2.15m 距离阈值决定，不依赖该朝向容差。
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.6
      stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.6
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # 阿克曼可行域：车不能原地转。**实际生效的舵角上限是 ±0.6 rad**——URDF 的
      # left/right_steering_hinge_joint limit 写的是 ±1，但真正在跑的 nav_sim
      # （tianracer_gazebo/scripts/transform.py，参数 max_steering_angle: 0.6）
      # 在换算后把舵角钳到 ±0.6 才下发，所以 ±0.6 才是有效限位。
      # transform.py 做 δ = atan(L·ω/v)，L=0.26 -> 转弯半径 R = L/tanδ = v/ω。
      #
      # 为什么要把 max_vel_theta 由 1.0 提到 4.7（2026-09-12 实测）：原值 1.0 与
      # min_vel_x 0.4 是自洽的（tan(0.6)/L×0.4 = 1.05），但那只在低速成立——
      # R = v/ω，ω=1.0 意味着 **R ≥ v**：车速一到 2.5 m/s 就需要 R=2.5m，
      # 而赛道净宽仅 0.96m，这个弯物理上拐不过去（实测：车以 1.90 m/s 冲进
      # (-4,-8) 附近的弯角后卡死 17.8s；改成 4.7 后同一弯角以 0.10m 贴近距离通过）。
      # 提到 4.7 后低速段会出现 ω > 2.63·v 的采样对，被 transform.py 钳到 ±0.6
      # （车实际转得比 DWB 预测更宽，靠反馈 critics 修正）——属可接受的软代价。
      #
      # min_vel_x 不随之抬高（**已实测权衡**）：严格自洽要求 max_vel_theta ≤ 2.63×min_vel_x，
      # 但那会要求 min_vel_x ≥ 1.8，而实测把 min_vel_x 由 0.4 抬到 0.8 就出现致命退化——
      # 车贴近障碍时 `No valid trajectories out of 420!` ×112（420 条候选 100% 撞致命格，
      # 因为 v≥0.8 的弧线全部出自由区），既不能脱困也不能蠕动，被裁判 10s 未移动判据终止。
      # 采样不自洽是软代价，失去低速可机动性是硬故障，故只把地板抬到安全区上沿。
      # ⭐ 定稿 0.6（2026-09-13，方案1「抬地板」）：
      # 0.7 系上边界探测（99.45s / 104.52s，均值 102.0s），与 0.6（均值 103.0s）
      # 统计上无差别、离 0.8 致命悬崖更近（齿尖 vx≥0.8 弧线 100% 撞致命格先例），
      # 故取 0.6。相比原 0.4：实测快约 8s（111.25 → ~103s），钉地板占比 20.9%→~15%，
      # 减速段 11→~1（仅终点），NVT/THO 计数与 0.4 完全相同。
      min_vel_x: 0.6
      min_vel_y: 0.0
      # ── 实验②（2026-09-15）：速度上限 2.0 -> 2.5 ── ✅ 已通过 ────────
      # 动机：实验① 把车到真墙的最坏净距从 0.146 m 抬到 0.298 m（死锁阈值 0.14 m）。
      #   旧配置下 2.5 的期望分只有 46.21（5 轮 3 完赛），是死在卡点弯的死锁上；
      #   余量翻倍后值得复测。只动速度这几行，inflation_radius 保持 0.45，以便归因。
      # 结果（5 个有效轮，全部 9/9 完赛，NVT 全 0）：
      #   期望分 60.30（逐轮 60.218/60.336/60.358/60.303/60.304）
      #   均圈速 142.7 s（@2.0 为 171.0 s）；关键 52m 赛段余量 2.24 s -> 6.94 s
      # 对照：@2.0+0.45 期望分 58.60、@2.0+0.3 为 56.13、@2.5+0.3 为 46.21。
      # ⚠️ 代价：@2.5 下 C（车世界系到真墙）最小净距 0.182 m，仅为阈值的 1.30 倍
      #   （@2.0 是 0.298 m / 2.10 倍）。这是拿更薄的几何余量换速度 ——
      #   今后若再动 local_costmap 的 footprint/robot_radius，必须退回 @2.0 重新标定。
      # ── 实验⑥（2026-09-18）：速度上限 2.5 -> 3.0 ── ❌ 实测无效，已回退 ────
      # 动机：racetrack_1 得分 10.38（另三条 14.5~16.5），差距全在速度项
      #   （门分 50 固定；35×42/T 里 T=142s ⇒ 10.36）。运动学估算每 +0.25 m/s ≈ +1 分。
      # 结果（1 个有效轮 r1v3_try1，9/9、未触发顶点死锁）：
      #   **成绩几乎不变**——60.36 → 60.382 分，用时 158.1 → 159.1s（反而慢 1.0s）。
      #   车稳定跑在候选栅格点 **2.4947**，`cmd_vx >= 3.0` 的时间占比 **0.0%**；
      #   与 max_vel_x 相差 <0.02 的帧仅 1.6%，与 2.5 相差 <0.02 的占 48.2%。
      # 真因（已用 6720 条候选实测）：**不是**硬件/运动学/物理——URDF 车轮限位
      #   1000 rad/s（3.0m/s 只用 9.4%）、41/41 快照存在 vx=3.0 合法候选
      #   （n_infeasible=0）、驱动是 kinematic 无摩擦模型。而是 DWB 的 critic 结构：
      #   PathDist/GoalDist 在 vx≈2.5 **饱和归零**，此后 PathAlign 单调上涨
      #   （低速 5.99 → 高速 17.89）把总代价推高 ⇒ 代价曲线在 2.495 触底后单调升。
      #   自检 41/41 + 19/19 证明 DWB 选的就是最小代价候选——它没做错事。
      # ⇒ 只抬速度上限对 DWB 是**无效操作**，它会自行消化掉。
      # 回退理由：配置写 3.0、行为恒为 2.495，留着只会造成归因混乱。
      max_vel_x: 2.5
      max_vel_y: 0.0
      max_vel_theta: 4.7
      min_speed_xy: 0.0
      max_speed_xy: 2.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      # 轨迹地平线（轨迹长度 = sim_time × 速度）。
      # 原 1.7 配当时更高的速度上限时，轨迹远超赛道净宽，273 条候选 100% 撞致命格
      # （日志 "1.00: BaseObstacle/Trajectory Hits Obstacle."），车陷死区原地不动。
      # 0.8 × 1.5 = 1.2m 可产生有效轨迹（基线 113.61s / 9-9 门）。
      #
      # ⚠️ 2026-09-13 实测：试过 1.2（方案 A，想靠更长视界越过西侧走廊的横墙齿，
      # 让 DWB 规划连续 S 形以减少「锯齿式减速」）——**失败，已回退，勿再试**。
      # 结果：0/9 门、11.93m、25.42s 被判停车，卡在西侧走廊第二道齿尖
      # (-1.78, 2.68)（该齿向东延伸到 x≈-1）。视界 1.8m 让齿尖处所有候选轨迹
      # 都撞格：`No valid trajectories` 22→116（5.3×）、`Trajectory Hits Obstacle`
      # 11→58（5.3×）、`failed to create plan` 0→3。
      # 结论：**这条走廊要求 DWB 的视界保持短**；视界越长，齿尖处越没有可行弧线。
      # 减速是走廊几何的必然结果，不是能靠调视界消除的配置问题。
      sim_time: 0.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      # ── 实验⑤（2026-09-16）：换轨迹生成器 ── ❌ 已回滚 ────────────────
      # 动因：StandardTrajectoryGenerator（默认）的轨迹长度 = sim_time × vx，固定 sim_time
      #   意味着**速度越快的候选轨迹越长**；而 GoalDist 打的是「轨迹末端到目标点的距离」，
      #   目标点由 forward_prune_distance 封顶在车前 2.0 m，而 L_max = 0.8 × 2.5 = 2.0 m，
      #   两者恰好相等。这是结构性耦合，不是权重能改的（候选级反事实已证）。
      #   LimitedAccelGenerator 换的正是「速度采样怎么生成」，本可直击这个结构。
      # 结果：**两种配置都失败，且不是调参能救的**（2026-09-16 实测）
      #   · 缺 `sim_period`（默认 -1.0）：车 1/9、跑 29.2m 后卡死；
      #   · 补 `sim_period: 0.05`：**车一步未动**（odom 1282 帧跨度 0.000m，停在起点），
      #     而控制器发了 889 帧非零 cmd_vx ⇒ 指令出了底盘没动。
      #   两轮控制器告警 `Control loop missed its desired rate of 20Hz` 126~357 次、
      #   `BT tick rate 100 exceeded` 256~313 次；**对照全部 Standard 轮次是 0~1 次**。
      # ❌ 根因（推断，未验证）：它只在「当前速度 ± acc_lim_x×sim_period」窗口里采样，
      #   即 ±2.5×0.05 = ±0.125 m/s。而本项目 `min_vel_x: 0.6` 是早先实测抬上来的定稿值
      #   （0.4→0.6 换来约 8s）——**静止时窗口 [−0.125,+0.125] ∩ [0.6,2.5] = 空集**
      #   ⇒ 没有候选 ⇒ 车永远起不来。要让它可用就得把 min_vel_x 降回 0 附近，
      #   等于丢掉那 8s，两头不讨好。**不要再试这个方向。**
      # ⇒ 生成器保持默认（不写此键即 StandardTrajectoryGenerator）。
      stateful: True
      # 去掉 RotateToGoal / GoalAlign：二者奖励「原地转向对准目标朝向」，而阿克曼车
      # 既不能原地转（vx ≥ min_vel_x）又受 ±0.6rad 舵角限位（transform.py 钳位）约束，留着只会持续产生
      # 不可行轨迹，是 "No valid trajectories" 的主要来源之一。
      # BaseObstacle.scale 0.02 -> 0.3：原值几乎不给障碍代价权重，车贴着膨胀层走；
      # 提高后轨迹会主动避开高代价区，减少「贴墙进死区」。
      critics: ["Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist"]
      # ⚠️ BaseObstacle.scale 保持 0.3：2026-09-13 试过降到 0.15（想缩小快慢档的
      # BaseObstacle 差距——慢档轨迹短、离墙远，BO 恒为 0 白占便宜），**实测倒退**：
      # 112.16s 对 goal36 的 111.25s。西侧蛇形第 4 段 1.08→1.00（退）、第 7 段
      # 1.03→1.08（进），两段互相抵消、整体略差。**故回退，勿再试。**
      BaseObstacle.scale: 0.3
      PathAlign.scale: 32.0
      # ── 实验④（2026-09-15）：forward_point_distance 0.1 -> 0.35 ── ❌ 已回滚 ──
      # 动机：0.1 看起来偏小（Nav2 官方默认 0.325、社区指南说「约等于车长」），
      #   以为航向对齐只评估车脚下、看不到即将到来的弯 ⇒ 入弯晚、只能靠刹车补救。
      # 结果（4 个有效轮，第 5 轮未跑——判据已算术上不可能通过）：
      #   期望分 60.066 vs 60.304；均圈速 **146.1 s vs 142.7 s（倒退 3.4 s）**；
      #   四轮全部慢于对照配置的**任何**一轮 ⇒ 明确倒退。
      #   ⚠️ 里程同时 +0.4 m，按里程∝圈速折算约 0.18 s 来自「线更长」，
      #     净「同样的线开得更慢」≈3.2 s；两种拆法都是倒退。
      # ❌ 根本原因：这个参数**同时放大 PathAlign 的原始分**——航向偏 θ 时评估点越远
      #   位置偏差越大，等效于把 PathAlign 权重放大约 3.5 倍。「看得更远」与
      #   「对齐更严」被它绑死、无法单独调，而本项目已证「三个距离类 critic 合计」
      #   正是压慢车的原因。**不适合作为杠杆，不要再试。**
      # ★ 0.1 不是抄模板留下的，而是 Nav2 issue #938 的刻意 workaround：
      #   该 issue 记录 PathAlign/GoalAlign 会把车在过弯时带得极贴障碍物，
      #   把 forward_point_distance 设为 0.1「drastically improved the stability」。
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      # GoalDist.scale 24.0 -> 36.0（2026-09-13，**实测最优，保留**）。
      #
      # 实测：三圈 9/9 门 / 111.25s，对比原值 24 的 113.70s —— 快 2.45s（2.2%）。
      # 改善集中在西侧「梳齿蛇形」走廊（减速最密集处）：第 4 段 0.96→1.08（+12.5%）、
      # 第 7 段 1.00→1.03；其余段持平。减速段由 15 段/25.7s 降到 11 段/22.8s。
      #
      # 依据（实测 DWB 每周期全部候选的得分）：
      #   精确公式 total = 0.30·BaseObstacle + 0.80·PathAlign + 0.80·PathDist
      #                        + 0.60·GoalDist   （6026 条合法轨迹最小二乘，残差 0）
      # 即 yaml 的 scale 0.3/32/32/24 对应的实际权重是 0.3/0.8/0.8/0.6——
      # 三个「距离类」critic 的 raw_score 被 DWB 除以了 40（消息自带的 critic_scales
      # 字段可证：yaml 36 对应消息 scale 0.9）。改 yaml 值前务必按 /40 换算。
      #
      # ⚠️ **但 36 并未根治问题**：11 个减速现场仍全部是「软代价」——实选恒为
      # min_vel_x=0.40，而满速 1.50 的可行解就在候选集里（可行候选 420/420）。
      # 修正口径后的反事实扫描（用消息 scale、过滤 total<0 的非法轨迹哨兵）显示：
      #   w_goal 0.2~0.9（yaml 8~36）全部仍选 0.40；需 ≥1.2（yaml 48+）才升到 0.81。
      # 深层原因是 **sim_time × vx 的耦合**：慢速轨迹只穿越 0.32m、天然离障碍远且
      # 无需转向，故其总分结构性更低。**只调 critic 权重无法对抗这个几何事实。**
      GoalDist.scale: 36.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_namespace>/odom
      robot_base_frame: <robot_namespace>/base_link
      use_sim_time: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # 以下三项对齐 ROS1 tianracer_navigation/param/teb_carlike/costmap_common_params.yaml：
      # inflation_radius 0.3、cost_scaling_factor 10.0，且未设 robot_radius（用 costmap 默认 0.1）。
      # 本文件此前由 TurtleBot3 Nav2 模板抄来，三项被放大到 2.5 / 8.0 / 0.305，在 0.96m 宽的
      # 赛道里会把走廊压成零自由代价格，导致 DWB「No valid trajectories」。
      # 局部代价地图由 3x3 放大到 6x6（原为 4x4）：DWB 需要看到足够远的转弯才能规划过弯。
      # robot_radius 0.1 -> 0.07：URDF 车体为 0.28x0.10 的 box（半宽仅 0.05），0.1 相当于
      # 把内切半径放大一倍，致命带随之变宽、窄道里更容易出现死区。
      robot_radius: 0.07
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: <robot_namespace>/map
      robot_base_frame: <robot_namespace>/base_link
      use_sim_time: true
      # 对齐 inflation_radius 0.3、cost_scaling_factor 10.0；
      # inflation_radius 已在实验① 中改为 0.45（理由见本块下方 inflation_layer 处）。
      # robot_radius 由模板的 0.305 降到 0.07（URDF 车体 0.28x0.10，半宽 0.05）
      robot_radius: 0.07
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /<robot_namespace>/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        # ── 实验①（2026-09-15）：global 侧膨胀半径 0.3 -> 0.45 ──────────
        # 依据（实测 /plan 的净距）：
        #   改动前全局路径在卡点弯离墙约 0.326 m（= 到 >=99 带中位 0.256 + 内切带 0.07），
        #   而 inflation_radius=0.3 的影响圈刚好**止步于它之外** ⇒ 路径点代价恒为 0，
        #   规划器没有任何动力再往外走。要把路径推出去，必须让影响圈越过它。
        #   同时实测 A(路径)→B(车,地图系) 几乎相等 ⇒ DWB 跟踪良好、问题不在跟踪；
        #   C(车,世界系) 最小仅 0.146 m，而 DWB 死锁阈值是 0.14 m ⇒ 车正压在阈值上。
        # 只改 global 侧：local 侧不动（它决定 DWB 的致命判据，改它会同时动死锁阈值，无法归因）。
        # ── 实验③（2026-09-15）：global 侧膨胀半径 0.45 -> 0.35 ── ❌ 已回滚 ──
        # 动机：①/② 之后 5/5、NVT 全 0，但分数由 35·min(1,42/总用时) 主导，要再提分
        #   只能更快，而膨胀半径越大越慢 ⇒「把膨胀层调到极限」的方向是**往下压**。
        #   预测边界 ≈0.34 m（cost(0.33)=18.6 而半径只决定在哪里截断），故取 0.35 逼近。
        # 结果（5 个有效轮，全部 9/9）：期望分 60.334 vs 60.304（**+0.03，t=0.59，p≈0.57**）；
        #   均圈速 142.3 s vs 142.7 s；里程 **322.79 m vs 324.91 m（短 2.12 m）**。
        # ⇒ 假设方向对了（0.45 确实在往外推车、白付 2.1 m），**但收益为零**：
        #   2.12 m 只占全程 0.65%，即便全转化为时间也只有 0.93 s，实测 0.40 s，落在噪声内。
        # ❌ **否决理由不是分数，是安全底线被击穿**：
        #   C(车世界系到真墙) 最坏 0.182 m -> **0.112 m**（跌破 0.14 m 死锁阈值）；
        #   NVT 0 -> 2，且 exp3_5 有 9 帧真的进到禁区、靠自救才跑完。
        #   注：C_min 单轮波动极大（同一配置内 0.182~0.474），判护栏要用二值的
        #   「5/5 + NVT 全 0」，单轮 C_min 无意义。
        # ⚠️ 另一条实测结论：DWB **不会**因为靠近墙而减速（各离墙档的 cmd_vx 中位数
        #   恒为 2.4~2.5）。减速的真因是 GoalDist 的「末端曼哈顿距 × sim_time×vx」耦合，
        #   与墙无关。所以别再指望「调膨胀半径 → 车敢贴墙 → 更快」这条链。
        inflation_radius: 0.45
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "turtlebot3_world.yaml"
    map_topic: /<robot_namespace>/map
    frame_id: <robot_namespace>/map

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 对齐 ROS1 tianracer_navigation/param/teb_carlike/global_planner_params.yaml：
      #   allow_unknown: false          # 明确关闭，须配合 track_unknown_space: true
      #   default_tolerance: 0.1
      #   use_dijkstra: true
      # 本图 87.9% 为未知区，allow_unknown: true（模板默认）会让规划器穿未知区抄近路、
      # 绕开真实赛道与检查门；关闭后路径被约束在已建图的赛道内。
      tolerance: 0.1
      use_astar: false
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: <robot_namespace>/odom
    robot_base_frame: <robot_namespace>/base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

# 本段此前缺失，导致 velocity_smoother 节点吃 Nav2 编译期默认 max_velocity [0.5, 0, 2.5]
# ——实测 cmd_vel.x 最大值恰好 0.500，DWB 与 TEB 的局部规划器限速都被它压在下面，
# 这是「车速上不去」的真正原因（`navigation_launch.py:259-263` 把 cmd_vel_smoothed
# 重映射为 cmd_vel，即平滑器在控制链路上，不可绕过）。
# max_accel/max_decel 与 DWB 的 acc_lim/decel_lim 对齐，避免平滑器引入额外限速。
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 实验②：随 max_vel_x 同步抬到 2.5（角速度上限仍留 2.5，见下方说明——它一直在起保护作用）
    # 实验⑥（已回退）：曾随 max_vel_x 3.0 同步抬到 3.0，实测无效（车恒跑 2.495）。
    max_velocity: [2.5, 0.0, 2.5]
    min_velocity: [-2.5, 0.0, -2.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200